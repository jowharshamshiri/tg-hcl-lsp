<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-{{nonce}}'; script-src 'nonce-{{nonce}}';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terragrunt lineage graph</title>
  <style nonce="{{nonce}}">
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--vscode-foreground);
      background: var(--vscode-editor-background);
      font: 13px/1.45 var(--vscode-font-family);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px 18px 12px;
      border-bottom: 1px solid var(--vscode-panel-border);
      background: var(--vscode-editor-background);
    }
    .heading { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    h1 { margin: 0; font-size: 15px; font-weight: 600; }
    #summary { color: var(--vscode-descriptionForeground); }
    .toolbar { display: flex; align-items: center; gap: 8px; }
    #filter {
      min-width: 180px;
      max-width: 420px;
      flex: 1;
      height: 36px;
      padding: 0 10px;
      color: var(--vscode-input-foreground);
      background: var(--vscode-input-background);
      border: 1px solid var(--vscode-input-border, transparent);
      outline: none;
    }
    #filter:focus { border-color: var(--vscode-focusBorder); }
    button {
      min-height: 36px;
      padding: 0 12px;
      color: var(--vscode-button-secondaryForeground);
      background: var(--vscode-button-secondaryBackground);
      border: 0;
      border-radius: 2px;
      cursor: pointer;
    }
    button:hover { background: var(--vscode-button-secondaryHoverBackground); }
    button:focus-visible, summary:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: 1px; }
    main { padding: 14px 18px 32px; }
    #status {
      min-height: 96px;
      display: grid;
      place-items: center;
      color: var(--vscode-descriptionForeground);
      text-align: center;
    }
    #status[hidden], #tree[hidden] { display: none; }
    ul { list-style: none; margin: 0; padding-left: 20px; border-left: 1px solid var(--vscode-tree-indentGuidesStroke); }
    #tree > ul { padding-left: 0; border-left: 0; }
    li { position: relative; margin: 2px 0; }
    li::before { content: ''; position: absolute; top: 16px; left: -20px; width: 14px; border-top: 1px solid var(--vscode-tree-indentGuidesStroke); }
    #tree > ul > li::before { display: none; }
    summary, .leaf {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 6px;
      border-radius: 3px;
    }
    summary { cursor: pointer; }
    summary:hover, .leaf:hover { background: var(--vscode-list-hoverBackground); }
    .kind {
      min-width: 58px;
      padding: 1px 6px;
      border-radius: 10px;
      color: var(--vscode-badge-foreground);
      background: var(--vscode-badge-background);
      font-size: 11px;
      text-align: center;
    }
    .kind[data-kind="include"] { color: var(--vscode-charts-blue); background: color-mix(in srgb, var(--vscode-charts-blue) 16%, transparent); }
    .kind[data-kind="dependency"] { color: var(--vscode-charts-purple); background: color-mix(in srgb, var(--vscode-charts-purple) 16%, transparent); }
    .kind[data-kind="read"] { color: var(--vscode-charts-green); background: color-mix(in srgb, var(--vscode-charts-green) 16%, transparent); }
    .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .open {
      min-width: 44px;
      margin-left: auto;
      padding: 0 10px;
      color: var(--vscode-textLink-foreground);
      background: transparent;
      opacity: .72;
    }
    summary:hover .open, .leaf:hover .open, .open:focus-visible { opacity: 1; }
    .match > summary, .match > .leaf { background: var(--vscode-editor-findMatchHighlightBackground); }
    @media (max-width: 520px) {
      .toolbar { flex-wrap: wrap; }
      #filter { flex-basis: 100%; max-width: none; }
      .kind { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="heading"><h1>Lineage graph</h1><span id="summary" aria-live="polite"></span></div>
    <div class="toolbar" role="toolbar" aria-label="Lineage graph controls">
      <input id="filter" type="search" placeholder="Filter units, stacks, includes, dependencies, or reads" aria-label="Filter lineage graph">
      <button id="expand" type="button">Expand all</button>
      <button id="collapse" type="button">Collapse all</button>
    </div>
  </header>
  <main>
    <div id="status" role="status" aria-live="polite">Building the Terragrunt graph…</div>
    <nav id="tree" aria-label="Terragrunt lineage graph" hidden></nav>
  </main>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
