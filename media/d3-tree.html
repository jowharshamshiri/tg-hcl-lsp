<!DOCTYPE html>
<html>
<head>
    <title>Terragrunt Dependency Tree</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
            width: 100vw;
            height: 100vh;
            background: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            overflow-y: auto;
            overflow-x: hidden;
        }

        text {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
            fill: var(--vscode-editor-foreground);
        }

        text:hover {
            cursor: pointer;
            text-decoration: underline;
        }

        circle {
            stroke-width: 1.5px;
        }

        /* Ensure SVG takes full width but allows scrolling */
        svg {
            display: block;
            margin: 0 auto;
            width: 100% !important;
            height: auto !important;
        }

        /* Error message styling */
        #error-message {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 120px;
            margin: 1.5rem auto;
            max-width: 500px;
            color: var(--vscode-errorForeground);
        }

        #error-message p {
            margin: 0.5rem 0 0 0;
            font-size: 13px;
            line-height: 1.4;
            text-align: center;
            color: var(--vscode-foreground);
            opacity: 0.8;
        }

        .error-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        .error-icon svg {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <script>
        const vscode = acquireVsCodeApi();
    </script>
    <script src="{{scriptUri}}"></script>
</body>
</html>
